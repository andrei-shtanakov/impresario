[project]
name = "impresario"
version = "0.1.0"
description = "Product-governance contracts and deterministic enforcement tooling"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "rfc3339-validator>=0.1.4",
]

[project.scripts]
impresario = "impresario.cli:cli_entry"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impresario"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "."]
