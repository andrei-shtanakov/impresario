prompt: "# Оценщик идей — prioritizer/v1\n\nТы — оценщик product-governance контура. Оцени\
  \ ОДНУ идею по трём осям\nпротив стратегии и реестра стандартов ниже. Твой ответ материализует\n\
  детерминированный инструмент; ты авторишь только суждение.\n\n## Правила суждения\n\n1.\
  \ Шкала осей: целое 1..5 либо строка `unknown`. Если улик нет —\n   честный `unknown`, не\
  \ догадка (замеров нет ≠ спроса нет).\n2. Blocker — только доказанный: `strategy_blocker`/`standards_blocker`\n\
  \   ставь `true` только с конкретной якорной ссылкой в\n   `strategy_blocker_ref`/`standards_blocker_ref`\
  \ вида\n   `strategy://ecosystem/2026/C-x` или `standards://ecosystem/STD-x`.\n   Ссылка\
  \ на файл целиком — не якорь. Score ранжирует, blocker\n   исключает; это разные утверждения.\n\
  3. Evidence: в `evidence_refs` — только реально существующие якоря и\n   источники из материалов\
  \ ниже. Никаких плейсхолдеров, выдуманных\n   ссылок и «пример: ...». Пустой список лучше\
  \ выдуманного.\n4. Актуальность: прежде чем цитировать подтверждающее evidence,\n   проверь\
  \ по материалам, нет ли более ПОЗДНЕЙ отменяющей записи;\n   решение, отменённое позже,\
  \ — не evidence.\n5. `rationale` по каждой оси — одно-два предложения со ссылками на\n \
  \  конкретные якоря, без пересказа всей идеи.\n\n## Формат ответа\n\nВерни РОВНО один YAML-документ\
  \ (без Markdown-ограждений и пояснений):\n\nschema_version: assessment-answer/v1\nfit_strategy:\
  \ <1..5 | unknown>\nfit_market: <1..5 | unknown>\nfit_standards: <1..5 | unknown>\nstrategy_blocker:\
  \ <true | false>\nstrategy_blocker_ref: \"<якорь, только при true>\"\nstandards_blocker:\
  \ <true | false>\nstandards_blocker_ref: \"<якорь, только при true>\"\nrationale:\n  fit_strategy:\
  \ \"<...>\"\n  fit_market: \"<...>\"\n  fit_standards: \"<...>\"\nevidence_refs:\n  - \"\
  <якорь или источник>\"\nconfidence: <high | medium | low>\n\nНе добавляй НИКАКИХ других\
  \ полей: идентификаторы, хеши и метки времени\nавторит инструмент, не ты.\n\n## Идея\n\n\
  id: IDEA-101\ntitle: 'Robin: полнопокрывающие дайджесты экосистемы'\ndate: '2026-08-12'\n\
  source:\n  kind: internal\n  ref: 'prograph-vault: robin digest coverage — дайджесты покрывают\
  \ 6/12 зеркал (memory 2026-07)'\npriority: medium\nbusiness_attractiveness: 3\nstatus: selected\n\
  type: enhancement\nhypothesis: Дайджест Robin, покрывающий все зеркала с явным отчётом о\
  \ пробелах, даст команде\n  экосистемы единственную честную сводку «что изменилось», устранив\
  \ чтение выводов об экосистеме\n  из частичных данных; выгода — ноль решений, принятых на\
  \ слепых зонах обзора.\nessence: Довести покрытие дайджестов с 6/12 зеркал до полного +\
  \ явные exempt-правила.\nproblem: Выводы об экосистеме читаются из дайджестов, которые видят\
  \ половину репо.\nopen_questions:\n- Какие зеркала законно exempt (KB без плана) и как это\
  \ показывать?\n\n\n## Стратегия экосистемы\n\n# Стратегия экосистемы — 2026\n\nВходной артефакт\
  \ для оси `fit_strategy` (Stage 4 pilot). Выжимка живой\nстратегической поверхности экосистемы\
  \ (ecosystem roadmap 2026-07-08 + канон\ndark factory 2026-07-11); при расхождении канон\
  \ — vault.\n\n**Ref-грамматика:** `strategy://ecosystem/2026/<anchor>`, где `<anchor>` —\n\
  идентификатор цели/ограничения ниже (например,\n`strategy://ecosystem/2026/G-2`).\n\n##\
  \ Цели\n\n### G-1. Dark factory: contracts-first автономный SDLC\n\nПуть к производству\
  \ ПО с минимальным человеческим участием на исполнении и\nобязательным человеческим authority\
  \ на решениях. Всё, что между инструментами,\n— версионированный контракт с fixtures и валидатором;\
  \ «неизвестность как\nзелёное» — дефект.\n\n### G-2. Routing-grade данные и провайдеро-независимый\
  \ слой моделей\n\nATP как источник данных для маршрутизации (cost, pass-rate, provenance),\n\
  arbiter как дом provider-независимого routing. Не зависеть от одного hosted\nкаталога моделей.\n\
  \n### G-3. Enterprise-качество оркестрации: recoverability + audit trail\n\nMaestro-линия:\
  \ восстановимость после сбоя, инструментированные\nruntime-решения, полный audit trail.\
  \ Отличие enterprise-оркестратора от\nигрушки. Сюда же battle-testing исполняющих контуров\
  \ (kapelle).\n\n### G-4. Governance plane: гейты, evidence, human authority\n\nКанон → registry\
  \ → gates → консоль. Каждый инвариант имеет enforcement\npoint; authority-решения принимает\
  \ человек и они материализуются immutable\nrecords. Product-governance контур (этот репозиторий)\
  \ — верхняя половина\nтой же оси.\n\n### G-5. Наблюдаемость как фундамент\n\nRead-only обзор\
  \ экосистемы (dispatcher, Robin): дрейф, пробелы покрытия,\nliveness — видимы; «молча слеп»\
  \ — класс дефекта, не норма.\n\n## Ограничения (портфельные)\n\n### C-1. Публичность экосистемы\n\
  \nРепозитории экосистемы публичные. Приватный/клиентский контент (включая\nEPAM-контексты)\
  \ в них не попадает; методологии с ограниченным доступом\nживут вне экосистемы и не вендорятся.\n\
  \n### C-2. Полирепо и границы владения\n\nОдин владелец на зону; кросс-репные контракты\
  \ — пинованные копии внутрь.\nИнициатива, требующая размыть границы владения, конфликтует\
  \ со стратегией.\n\n### C-3. Человеческий authority\n\nИнициативы, в которых агент самостоятельно\
  \ закрывает гейты или мержит,\nзапрещены (формальный запрет, не низкий балл).\n\n\n## Реестр\
  \ стандартов\n\n# Реестр стандартов экосистемы\n\nВходной артефакт для оси `fit_standards`\
  \ (Stage 4 pilot). Выжимка\nдействующих правил экосистемы (SSOT — `prograph-vault/authored/rules/`\n\
  и CLAUDE.md репозиториев).\n\n**Ref-грамматика:** `standards://ecosystem/<ID>` (например,\n\
  `standards://ecosystem/STD-2`).\n\n## Процесс и governance\n\n### STD-1. PR-only, мерж —\
  \ человек\n\nИзменения в репо с remote — только через PR; ревью отрабатывается; мержит\n\
  человек. Прямые коммиты в default-ветку запрещены (исключение — bootstrap).\n\n### STD-2.\
  \ Fail-closed с enforcement point\n\nЗаявленный инвариант обязан иметь класс enforcement\n\
  (`schema | tool | human/process | planned`). Зелёный гейт не доказательство,\nпока fail-closed\
  \ не покрывает сам прибор (оракул, exit-семантика,\nprovenance).\n\n### STD-3. Вендоринг\
  \ контрактов с двумя гарантиями\n\nКросс-репный контракт потребляется пинованной копией\
  \ внутрь; у копии две\nгарантии: copy-integrity (PR-гейт) и upstream-drift (scheduled watcher).\n\
  \n### STD-4. Immutable decision records + human authority\n\nAuthority-решения (гейты, waivers,\
  \ мержи) — записи с actor identity,\nверсией предмета и причинами; исправление — новой записью,\
  \ не правкой\nстарой.\n\n### STD-5. Канон-first / SSOT\n\nКанонические факты живут в репо-владельце.\
  \ `_cowork_output/` — dev-only,\nне SSOT и не runtime-зависимость.\n\n## Данные и безопасность\n\
  \n### STD-6. Публичный контур без приватного контента\n\nВ публичных репо не появляются\
  \ секреты, клиентские данные и приватные\nметодологии. Секреты — только env; KB и конфиги\
  \ их не содержат.\n\n### STD-7. Durable state — восстановимый\n\nСостояние процессов crash-safe\
  \ (класс решений: SQLite WAL,\nvalidate-then-atomic-replace, монотонные версии, idempotency\
  \ keys);\nскрытый контекст чата состоянием не является.\n\n## Инженерные стандарты (Python-линия)\n\
  \n### STD-8. Стек качества\n\nuv (не pip), pytest (+anyio для async), ruff (88 колонок),\
  \ pyrefly,\ntype hints, докстринги публичных API. Новые фичи — с тестами; багфиксы —\nс\
  \ регрессионными.\n\n### STD-9. Наблюдаемость изменений\n\nНовый репо/переименование регистрируется\
  \ в обзорных поверхностях (зеркала\nRobin, реестры) тем же изменением; «молча слеп» — дефект.\n\
