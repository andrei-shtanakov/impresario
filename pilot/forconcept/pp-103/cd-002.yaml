proposal_delta: 'Acceptance-контур уточнён фактурой RP-002: (a) arbiter-mcp при старте валидирует
  agents.toml против user-config каталога ($ATP_CATALOG/XDG) — скоуп «валидация, не замена
  enrollment-плоскости»; (b) conformance-фикстуры зелёные у трёх загрузчиков, работа сведена
  к одному owner-пути (требование к handoff: назвать владельца — devtools-фикстуры либо Maestro
  shared-lib — или явную последовательность); (c) swap-смоук: retire+promote правкой каталога
  через явный $ATP_CATALOG; без правок кода и конфига у потребителей (Maestro); на стороне
  arbiter допускается scaffold-apply agents.toml + рестарт; решение route_task отражает промоушн.
  Value_prop и бизнес-модель уточнены оговоркой про scaffold-apply. Предположение о готовности
  Maestro закрыто RP-002.'
