  \ строго: `research-pack://RP-NNN`\n   (например, `research-pack://RP-002`), другие форматы\
  \ отклоняются.\n4. Отработай запросы creator'а из истории (requests_to_researcher его\n\
  \   последнего concept draft), если они есть.\n5. `brief_for_creator` — концентрированная\
  \ выжимка для creator'а, не\n   пересказ всего пака.\n\n## Формат ответа\n\nВерни РОВНО\
