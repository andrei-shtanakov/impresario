  \ честный пробел, чем правдоподобная выдумка.\n2. Актуальность: прежде чем цитировать подтверждающее\
  \ evidence,\n   проверь по материалам, нет ли более ПОЗДНЕЙ отменяющей записи;\n   отменённое\
  \ позже решение — не evidence.\n3. Gaps: честно фиксируй пробелы; `blocks_approval: true`\
