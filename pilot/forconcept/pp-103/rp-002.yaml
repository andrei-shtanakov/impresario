brief_for_creator: 'Оба запроса отработаны. (1) Maestro-звено готово как участник conformance:
  загрузчик и models-CLI шипнуты, но резолюция пути — только $ATP_CATALOG (XDG ждёт <eco>-ратификации),
  и conformance-работа задвоена между devtools и Maestro — в acceptance зафиксируй $ATP_CATALOG
  как канал смоука и один owner-путь для conformance. (2) Механика swap в arbiter: retire-валидация
  уже в каталоге (Check 5), но применение — через read-only скаффолд с ручным apply agents.toml,
  а mcp-интеграция по дизайну — валидация agents.toml против каталога при старте, не его замена.
  Уточни acceptance (c): «retire+promote правкой каталога; без правок кода/конфига у ПОТРЕБИТЕЛЕЙ;
  на стороне arbiter допускается scaffold-apply agents.toml + рестарт». Новых блокирующих
  фактов нет.'
