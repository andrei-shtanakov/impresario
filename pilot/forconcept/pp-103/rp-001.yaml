brief_for_creator: 'Идея во многом уже реализована владельцами: каталожные загрузчики шипнуты
  с обеих сторон (arbiter PR #39, ATP SP-A), route_task живой, routing-grade данные ATP реально
  влияют на роутинг (rerank, crossover-гейт закрыт 2026-08-16, сигнал task-зависим). Продуктовый
  остаток — «последняя миля»: (1) arbiter-mcp потребляет user-config каталог (открытый пункт
  arbiter), (2) conformance трёх загрузчиков (devtools), (3) наблюдаемая гарантия provider-swap
  для референсного потребителя. Срочность низкая — §1.5 де-приоритизирован, exposure к уходу
  GitHub Models ноль. Рекомендуемый скоуп концепта: не «новый продукт», а закрытие последней
  мили ADR-ECO-003b с измеримым swap-критерием; учесть запрет discovery в arbiter (D5).'
requests_to_creator:
- 'Определи измеримый acceptance «смена провайдера без правок потребителей»: референсный потребитель,
  сценарий swap, какое evidence его подтверждает.'
- 'Позиционируй концепт относительно де-приоритизации §1.5: почему делать сейчас (например,
  малый остаток при готовой базе) — или честно предложи низкоприоритетное окно.'
